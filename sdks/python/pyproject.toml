[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tirith"
version = "2.0.0"
description = "AI API cost observability — one import, full transparency"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ai", "llm", "cost", "observability", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/joedaviesio/tirith"
Documentation = "https://github.com/joedaviesio/tirith"
Source = "https://github.com/joedaviesio/tirith"

[tool.setuptools.packages.find]
include = ["tirith*"]
